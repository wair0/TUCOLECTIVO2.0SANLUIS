<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 520">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#040913"/><stop offset=".65" stop-color="#0A1830"/><stop offset="1" stop-color="#0F2747"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E6FBFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0A1426"/><stop offset="1" stop-color="#050A14"/></linearGradient>
<mask id="cut"><rect width="450" height="520" fill="#fff"/>
<rect x="0" y="236" width="450" height="3" fill="#000"/><rect x="0" y="252" width="450" height="5" fill="#000"/><rect x="0" y="269" width="450" height="7" fill="#000"/><rect x="0" y="288" width="450" height="9" fill="#000"/></mask>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<style>
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.halo{animation:halo 4s ease-in-out infinite;transform-origin:225px 215px}
@keyframes halo{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.6;transform:scale(1.06)}}
.w{animation:fl 5s steps(1) infinite}.w2{animation-duration:7s}.w3{animation-duration:9s;animation-delay:-3s}
@keyframes fl{0%{opacity:1}46%{opacity:1}48%{opacity:.15}52%{opacity:1}100%{opacity:1}}
.drive{animation:drive var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes drive{from{transform:translateX(-140px)}to{transform:translateX(580px)}}
.walk{animation:walk var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes walk{from{transform:translateX(-20px)}to{transform:translateX(470px)}}
.beacon{animation:tw 1.6s ease-in-out infinite}
.scan{animation:scan 5s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(520px)}}
</style>
</defs>
