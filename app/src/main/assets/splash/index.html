<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TU COLECTIVO 2.0 SAN LUIS</title>
<link rel="stylesheet" href="css/splash.css">
</head>
<body>
<main class="splash" id="splash">
  <section class="scene">
    <img src="assets/scene.svg" alt="">
    <div class="grid"></div>
    <div class="hud"><span></span><span>V1.1.10</span></div>
    <div class="br tl"></div><div class="br tr"></div>
  </section>
  <section class="main">
    <header class="brand">
      <h1>TU COLECTIVO <span>2.0</span></h1>
      <p>SAN LUIS</p>
    </header>
    <div class="load">
      <div class="meta"><span>PROGRESO</span><span class="pct"><span id="pct">0</span><small>%</small></span></div>
      <div class="bar"><div class="fill" id="fill"></div><div class="ticks"></div></div>
      <div class="steps" id="steps"></div>
      <div class="status"><span id="statusText"></span><span class="cur"></span></div>
    </div>
  </section>
</main>
<script>window.SPLASH_CONFIG={loop:true};</script>
<script src="js/splash.js"></script>
</body>
</html>
