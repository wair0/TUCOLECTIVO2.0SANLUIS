<!-- Header TU COLECTIVO 2.0 (High-Tech Corporativo) con menús contextuales. Requiere header.css y header.js -->
<header class="tc-hd" id="tc-hd" data-section="inicio" data-alerts="0" style="--i:0">
  <i class="tc-hd-beam"></i>
  <button type="button" class="tc-hd-btn" data-action="menu" aria-label="Menú" aria-haspopup="true" aria-expanded="false" aria-controls="tc-hd-menu"><span class="tc-hd-hex"></span><i class="tc-hd-fill"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M4,7 H20"/><path pathLength="1" d="M4,12 H14"/><path pathLength="1" d="M4,17 H18"/><circle pathLength="1" cx="19" cy="12" r="1.3"/></svg></button>
  <div class="tc-hd-center">
    <h1 class="tc-hd-title">TU COLECTIVO 2.0</h1>
    <div class="tc-hd-chip"><i class="tc-hd-led"></i><span class="tc-hd-status" id="tc-hd-status" aria-live="polite">SECCIÓN: INICIO</span></div>
  </div>
  <div class="tc-hd-right">
    <button type="button" class="tc-hd-btn" data-action="search" aria-label="Buscar" aria-haspopup="true" aria-expanded="false" aria-controls="tc-hd-search"><span class="tc-hd-hex"></span><i class="tc-hd-fill"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M16,16 L21,21"/><circle pathLength="1" cx="11" cy="11" r="6.5"/></svg></button>
    <button type="button" class="tc-hd-btn" data-action="notifications" aria-label="Notificaciones" aria-haspopup="true" aria-expanded="false" aria-controls="tc-hd-notifications"><span class="tc-hd-hex"></span><i class="tc-hd-fill"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M6,16 V11 A6,6 0 0 1 18,11 V16 L20,18 H4 Z"/><path pathLength="1" d="M10,21 H14"/></svg><i class="tc-hd-badge"></i></button>
  </div>
  <!-- Menú de la hamburguesa -->
  <div class="tc-hd-panel" data-for="menu" id="tc-hd-menu" role="menu" aria-label="Menú de secciones">
    <i class="tc-hd-pbeam"></i>
    <p class="tc-hd-ptitle"><span>Navegación</span><span>05 secciones</span></p>
    <div class="tc-hd-list"><button type="button" class="tc-hd-item current" role="menuitem" data-section="inicio" style="--n:0"><span class="tc-hd-item-ico"><span class="tc-hd-hex"></span><i class="tc-hd-fill"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3,11 L12,3 L21,11"/><path d="M5,9.5 V20 H19 V9.5"/><path d="M10,20 V14 H14 V20"/></svg></span><span>INICIO</span><svg class="tc-hd-item-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9,5 L16,12 L9,19"/></svg></button><button type="button" class="tc-hd-item" role="menuitem" data-section="lineas" style="--n:1"><span class="tc-hd-item-ico"><span class="tc-hd-hex"></span><i class="tc-hd-fill"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8,6 H15 A3,3 0 0 1 15,12 H9 A3,3 0 0 0 9,18 H16"/><circle cx="5" cy="6" r="1.6"/><circle cx="19" cy="18" r="1.6"/></svg></span><span>LÍNEAS</span><svg class="tc-hd-item-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9,5 L16,12 L9,19"/></svg></button><button type="button" class="tc-hd-item" role="menuitem" data-section="mapa" style="--n:2"><span class="tc-hd-item-ico"><span class="tc-hd-hex"></span><i class="tc-hd-fill"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,3 L21,8 L12,13 L3,8 Z"/><path d="M3,12 L12,17 L21,12"/><path d="M3,16 L12,21 L21,16"/></svg></span><span>MAPA</span><svg class="tc-hd-item-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9,5 L16,12 L9,19"/></svg></button><button type="button" class="tc-hd-item" role="menuitem" data-section="paradas" style="--n:3"><span class="tc-hd-item-ico"><span class="tc-hd-hex"></span><i class="tc-hd-fill"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6,3 H18 V10 H6 Z"/><path d="M12,10 V21"/><path d="M8,21 H16"/><path d="M9,6.5 H15"/></svg></span><span>PARADAS CERCANAS</span><svg class="tc-hd-item-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9,5 L16,12 L9,19"/></svg></button><button type="button" class="tc-hd-item" role="menuitem" data-section="favoritos" style="     <div class="tc-hd-theme" id="tc-hd-theme" role="radiogroup" aria-label="Tema de la app" style="--n:5;--t:0">
      <p class="tc-hd-ptitle"><span>Apariencia</span><span id="tc-hd-theme-now">AUTO · OSCURO</span></p>
      <div class="tc-hd-seg"><i class="tc-hd-seg-ind"></i><button type="button" role="radio" aria-checked="true" tabindex="0" data-theme-mode="auto" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,4 A8,8 0 0 1 12,20 Z"/><circle cx="12" cy="12" r="8"/></svg><span>AUTO</span></button><button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-mode="light"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,2 V4"/><path d="M12,20 V22"/><path d="M2,12 H4"/><path d="M20,12 H22"/><path d="M4.9,4.9 L6.3,6.3"/><path d="M17.7,17.7 L19.1,19.1"/><path d="M4.9,19.1 L6.3,17.7"/><path d="M17.7,6.3 L19.1,4.9"/><circle cx="12" cy="12" r="4"/></svg><span>CLARO</span></button><button type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-mode="dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20,14.5 A8,8 0 1 1 9.5,4 A6.5,6.5 0 0 0 20,14.5 Z"/></svg><span>OSCURO</span></button></div>
    </div>
  </div>
  <!-- Menú de la lupa -->
  <div class="tc-hd-panel" data-for="search" id="tc-hd-search" role="search" aria-label="Buscador">
    <i class="tc-hd-pbeam"></i>
    <p class="tc-hd-ptitle"><span>Búsqueda</span><span>Filtros rápidos</span></p>
    <div class="tc-hd-field" style="--n:0"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16,16 L21,21"/></svg><input class="tc-hd-input" id="tc-hd-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Línea, calle o parada..." aria-label="Buscar"><button type="button" class="tc-hd-clear" id="tc-hd-clear" aria-label="Borrar búsqueda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6,6 L18,18 M18,6 L6,18"/></svg></button></div>
    <div class="tc-hd-chips" id="tc-hd-chips"><button type="button" class="tc-hd-fchip on" data-filter="todo" aria-pressed="true" style="--n:1">TODO</button><button type="button" class="tc-hd-fchip" data-filter="lineas" aria-pressed="false" style="--n:2">LÍNEAS</button><button type="button" class="tc-hd-fchip" data-filter="calles" aria-pressed="false" style="--n:3">CALLES</button><button type="button" class="tc-hd-fchip" data-filter="paradas" aria-pressed="false" style="--n:4">PARADAS</button><button type="button" class="tc-hd-fchip" data-filter="favoritos" aria-pressed="false" style="--n:5">FAVORITOS</button></div>
    <p class="tc-hd-hint">ENTER ↵ PARA BUSCAR</p>
  </div>
  <!-- Menú de la campana -->
  <div class="tc-hd-panel" data-for="notifications" id="tc-hd-notifications" role="region" aria-label="Notificaciones">
    <i class="tc-hd-pbeam"></i>
    <p class="tc-hd-ptitle"><span>Notificaciones</span><button type="button" class="tc-hd-link" id="tc-hd-markread" disabled>Marcar leídas</button></p>
    <div class="tc-hd-notes" id="tc-hd-notes"></div>
  </div>
</header>
<div class="tc-hd-scrim" id="tc-hd-scrim"></div>
