name: Validar WebView y compilar Android

on:
  push:
    branches:
      - native/cyberpunkwebview-ui
  pull_request:
    branches:
      - native/cyberpunkwebview-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar JavaScript y compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK requerido
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Revisar sintaxis JavaScript
        run: |
          set -euo pipefail
          for file in \
            app/src/main/assets/header.js \
            app/src/main/assets/bottom-nav.js \
            app/src/main/assets/home-cards.js \
            app/src/main/assets/lineas.js \
            app/src/main/assets/script.js \
            app/src/main/assets/navigation-integration.js; do
            test -f "$file"
            node --check "$file"
          done

      - name: Compilar APK debug
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: tu-colectivo-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
