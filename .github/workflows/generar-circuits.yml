name: Validar generación de circuitos
on:
  push:
    branches:
      - native/cyberpunkwebview-ui
    paths:
      - tools/generar_circuits.py
      - .github/workflows/generar-circuits.yml
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: native/cyberpunkwebview-ui
      - name: Generar y comprobar circuitos
        run: |
          set -euo pipefail
          python3 tools/generar_circuits.py
          if git diff --quiet -- app/src/main/assets/circuits.css; then
            echo "circuits.css ya está actualizado."
          else
            echo "::warning::La generación cambia circuits.css. No se creará ni publicará ningún commit automático; incorpora ese archivo al commit del cambio que estés haciendo."
            git diff --stat -- app/src/main/assets/circuits.css
          fi
