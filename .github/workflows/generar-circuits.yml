name: Generar circuitos del diseño
on:
  push:
    branches:
      - native/cyberpunkwebview-ui
    paths:
      - tools/generar_circuits.py
      - .github/workflows/generar-circuits.yml
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: native/cyberpunkwebview-ui
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generar CSS de circuitos
        run: python3 tools/generar_circuits.py
      - name: Publicar CSS generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/circuits.css
          git commit -m "GENERAR circuits.css del diseño del ZIP" || exit 0
          git push origin HEAD:native/cyberpunkwebview-ui
