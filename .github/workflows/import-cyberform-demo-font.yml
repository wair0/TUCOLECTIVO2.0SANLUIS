name: IMPORTAR FUENTE CYBERFORM DEMO REAL

on:
  push:
    branches: [ "native/cyberpunk-ui" ]

permissions:
  contents: write

jobs:
  import-font:
    runs-on: ubuntu-latest
    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: EVITAR REEJECUCION DEL COMMIT FINAL
        run: |
          if git log -1 --pretty=%B | grep -q "REEMPLAZAR FUENTE CYBERPUNK POR CYBERFORM DEMO REAL"; then
            echo "COMMIT FINAL YA APLICADO. NO HAY NADA QUE HACER."
            exit 0
          fi

      - name: DESCARGAR OTF DESDE DROPBOX
        run: |
          curl -fL --retry 3 --retry-all-errors \
            'https://www.dropbox.com/scl/fi/kvgbxpc35tyhdlbct5nno/cyberformdemoregular.otf?rlkey=wv411xdijqbvd4eelqi6h35ro&st=eeh1sd15&dl=1' \
            -o /tmp/cyberformdemoregular.otf
          test "$(stat -c%s /tmp/cyberformdemoregular.otf)" = "55860"
          echo "9ef52a9f404a8a8935b7f25435f62ad74a216b7cf1b57974c043582ced0a79b9  /tmp/cyberformdemoregular.otf" | sha256sum -c -

      - name: INSTALAR FUENTE REAL
        run: |
          mkdir -p app/src/main/assets/fonts
          rm -f app/src/main/assets/fonts/cyberpunk.ttf
          cp /tmp/cyberformdemoregular.otf app/src/main/assets/fonts/cyberformdemoregular.otf
          sed -i 's#fonts/cyberpunk\.ttf#fonts/cyberformdemoregular.otf#g' app/src/main/java/com/transpuntano/app/MainActivity.kt
          test -f app/src/main/assets/fonts/cyberformdemoregular.otf
          grep -q 'fonts/cyberformdemoregular.otf' app/src/main/java/com/transpuntano/app/MainActivity.kt

      - name: COMMIT DEFINITIVO
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/import-cyberform-demo-font.yml
          git commit -m "REEMPLAZAR FUENTE CYBERPUNK POR CYBERFORM DEMO REAL"
          git push origin HEAD:${{ github.ref_name }}
