name: Build Android APK
on:
  push:
    branches: [ "main", "fix/estabilidad-produccion", "native/cyberpunk-ui" ]
  pull_request:
    branches: [ "main", "fix/estabilidad-produccion", "native/cyberpunk-ui" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cyberpunk font
        run: |
          test -f app/src/main/assets/fonts/cyberpunk.ttf
          test "$(stat -c%s app/src/main/assets/fonts/cyberpunk.ttf)" = "51900"
          echo "CYBERPUNK FONT VERIFIED: 51900 BYTES"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify Gradle environment
        run: |
          java -version
          ./gradlew --version

      - name: Verify Compose classpath
        run: |
          set +e
          echo "=== GIT HEAD ==="
          git rev-parse HEAD
          echo "=== APP BUILD GRADLE REAL ==="
          git show HEAD:app/build.gradle.kts
          echo "=== IMPLEMENTATION DECLARATIONS ==="
          ./gradlew :app:dependencies --configuration implementation --no-daemon --console=plain
          echo "=== DEBUG COMPILE CLASSPATH ==="
          ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon --console=plain
          echo "=== DEBUG RUNTIME CLASSPATH COMPOSE ==="
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --console=plain | grep -E "androidx.compose.(ui|runtime|foundation|material3)|androidx.activity:activity-compose" || true
          echo "=== COMPOSE INSIGHT COMPILE ==="
          ./gradlew :app:dependencyInsight --configuration debugCompileClasspath --dependency androidx.compose.ui:ui --no-daemon --console=plain
          echo "=== FIN VERIFICACION ==="
          ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon --console=plain > compose-final.txt 2>&1
          if ! grep -Eq "androidx.compose.(ui|runtime|foundation|material3)" compose-final.txt; then
            echo "ERROR: COMPOSE SIGUE AUSENTE DEL CLASSPATH DE COMPILACION"
            exit 1
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          echo "=== APK OUTPUT DIRECTORY ==="
          ls -lah app/build/outputs/apk/debug/ || true
          echo "=== ALL APK FILES ==="
          find app/build/outputs -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TUCOLECTIVO20
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
