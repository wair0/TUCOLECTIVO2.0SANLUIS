name: Build Android APK

on:
  push:
    branches: [ "native/hightechwebview-ui", "native/login" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-login:
    if: github.ref == 'refs/heads/native/login'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate login JavaScript syntax
        run: |
          for file in app/src/main/assets/{login,profile,favorites-sync,header}.js; do node --check "$file"; done
      - name: Run login and favorites smoke tests
        run: node tests/login/smoke.cjs
  build-debug-login:
    if: github.ref == 'refs/heads/native/login'
    needs: test-login
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build unsigned development APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Show debug APK SHA fingerprints for Firebase
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E 'Signer #1 certificate SHA-(1|256) digest'

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: TUCOLECTIVO-NATIVE-LOGIN-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  build-release:
    if: github.ref == 'refs/heads/native/hightechwebview-ui'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cyberpunk font
        run: |
          test -f app/src/main/assets/fonts/cyberpunk.ttf
          test "$(stat -c%s app/src/main/assets/fonts/cyberpunk.ttf)" = "51900"
          echo "CYBERPUNK FONT VERIFIED: 51900 BYTES"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare private signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TUCOLECTIVO20SANLUIS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > tucolectivo20sanluis-release.jks
          chmod 600 tucolectivo20sanluis-release.jks

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/tucolectivo20sanluis-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.TUCOLECTIVO20SANLUIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TUCOLECTIVO20SANLUIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TUCOLECTIVO20SANLUIS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew :app:assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle falló (intento $attempt/3); reintentando en 15 segundos por si es un error temporal de descarga."
              sleep 15
            fi
          done
          echo "::error::Gradle falló después de 3 intentos."
          exit 1

      - name: Rename Release APK
        run: |
          SRC="app/build/outputs/apk/release/app-release.apk"
          DST="app/build/outputs/apk/release/tucolectivo2.0sanluis.apk"
          test -f "$SRC"
          mv "$SRC" "$DST"
          ls -lh "$DST"

      - name: Verify signed APK
        run: |
          APK="app/build/outputs/apk/release/tucolectivo2.0sanluis.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TUCOLECTIVO20SANLUIS-v1.1.10
          path: app/build/outputs/apk/release/tucolectivo2.0sanluis.apk
          if-no-files-found: error
